# ============================================================
# Build OpenAppFilter (OAF) v7.0.1 for OpenWrt 24.10-SNAPSHOT
# Target : mediatek/filogic (MT7981/MT7986), aarch64_cortex-a53
# Kernel : 6.6.133  (匹配用户固件 uname -r = 6.6.133)
# 构建基础: openwrt/openwrt 提交 2b9f01bebcbe（openwrt-24.10 分支）
# ============================================================
name: Build OAF for OpenWrt 24.10 (kernel 6.6.133) mediatek/filogic

on:
  workflow_dispatch:

jobs:
  build-oaf:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd time

      - name: Get OpenWrt 24.10 source at kernel 6.6.133 commit (2b9f01bebcbe)
        run: |
          curl -fL -o openwrt-src.tar.gz https://codeload.github.com/openwrt/openwrt/tar.gz/2b9f01bebcbe
          mkdir -p openwrt
          tar -xzf openwrt-src.tar.gz -C openwrt --strip-components=1

      - name: Add OpenAppFilter v7.0.1 packages
        run: |
          git clone --depth 1 --branch v7.0.1 https://github.com/destan19/OpenAppFilter.git /tmp/OpenAppFilter
          cp -r /tmp/OpenAppFilter/oaf openwrt/package/oaf
          cp -r /tmp/OpenAppFilter/open-app-filter openwrt/package/open-app-filter
          cp -r /tmp/OpenAppFilter/luci-app-oaf openwrt/package/luci-app-oaf

      - name: Patch missing zh-cn translations (100% Chinese UI)
        run: |
          echo '' | base64 -d >> openwrt/package/luci-app-oaf/po/zh_Hans/oaf.po
          sed -i 's/List Mode/列表模式/g; s/Card Mode/卡片模式/g' openwrt/package/luci-app-oaf/luasrc/view/oaf/user_status.htm
          echo "--- po now has $(grep -c '^msgid' openwrt/package/luci-app-oaf/po/zh_Hans/oaf.po) msgids ---"

      - name: Update and install feeds (luci pinned to openwrt-24.10)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select mediatek/filogic target and enable OAF
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ipt-conntrack=y" >> .config
          make defconfig

      - name: Verify kernel version and target
        run: |
          cd openwrt
          echo "Kernel: $(grep 'LINUX_VERSION-6.6' include/kernel-6.6)"
          echo "Target: mediatek/filogic (aarch64_cortex-a53)"
          nproc
          free -h
          df -h /home/runner/work

      - name: Build host tools (staged)
        run: |
          cd openwrt
          make -j$(nproc) tools/install V=s

      - name: Build cross toolchain (staged)
        run: |
          cd openwrt
          make -j$(nproc) toolchain/install V=s

      - name: Build kernel linux-6.6.133 (creates required .config)
        run: |
          cd openwrt
          make -j$(nproc) target/linux/compile V=s

      - name: Compile OAF packages
        run: |
          cd openwrt
          make -j$(nproc) package/luci-app-oaf/compile V=s
          if ! find bin -name 'luci-i18n-oaf*.ipk' | grep -q .; then
            make -j$(nproc) package/luci-i18n-oaf-zh-cn/compile V=s || echo "(standalone i18n target unavailable)"
          fi
          echo "=== ALL ipk files under bin/ ==="
          find bin -name '*.ipk' | sort

      - name: Ensure luci-i18n-oaf-zh-cn ipk (manual fallback)
        run: |
          if find openwrt/bin -name 'luci-i18n-oaf*.ipk' | grep -q .; then
            echo "luci-i18n-oaf-zh-cn already built by luci.mk."
          else
            echo "Assembling luci-i18n-oaf-zh-cn manually..."
            PO2LMO="$(ls openwrt/staging_dir/hostpkg/bin/po2lmo openwrt/staging_dir/host/bin/po2lmo 2>/dev/null | head -n 1)"
            if [ -z "$PO2LMO" ]; then
              echo "ERROR: po2lmo tool not found under staging_dir"
              exit 1
            fi
            mkdir -p /tmp/i18n/usr/lib/lua/luci/i18n /tmp/i18n/etc/uci-defaults /tmp/i18n/CONTROL "$GITHUB_WORKSPACE/out"
            "$PO2LMO" openwrt/package/luci-app-oaf/po/zh_Hans/oaf.po /tmp/i18n/usr/lib/lua/luci/i18n/oaf.zh-cn.lmo
            printf 'uci set luci.languages.zh_cn="简体中文 (Simplified Chinese)"; uci commit luci\n' > /tmp/i18n/etc/uci-defaults/luci-i18n-oaf-zh-cn
            chmod 0755 /tmp/i18n/etc/uci-defaults/luci-i18n-oaf-zh-cn
            printf 'Package: luci-i18n-oaf-zh-cn\nVersion: 7.0-r1\nDepends: luci-app-oaf\nArchitecture: all\nMaintainer: OpenAppFilter build\nSection: luci\nPriority: optional\nDescription: Translation for luci-app-oaf - Simplified Chinese\n' > /tmp/i18n/CONTROL/control
            cd openwrt && staging_dir/host/bin/fakeroot staging_dir/host/bin/bash scripts/ipkg-build -m "" /tmp/i18n "$GITHUB_WORKSPACE/out"
            ls -la "$GITHUB_WORKSPACE/out/"
          fi

      - name: Collect ipk packages (from bin/packages AND bin/targets)
        run: |
          mkdir -p out
          find openwrt/bin -type f -name '*.ipk' \( -name 'kmod-oaf*.ipk' -o -name 'kmod-ipt-conntrack*.ipk' -o -name 'appfilter*.ipk' -o -name 'luci-app-oaf*.ipk' -o -name 'luci-i18n-oaf*.ipk' \) -exec cp -f {} out/ \;
          echo "=== OAF artifacts collected ==="
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oaf-ipk-mediatek-filogic-kernel-6.6.133
          path: out/
          if-no-files-found: error
